name: Release

# Tag push vX.Y.Z or vX.Y.Z-{alpha|beta|rc}.N: builds the signed release APK and the debug APK, verifies them and
# publishes the GitHub release "PulseStages X.Y.Z" with PulseStages-X.Y.Z.apk, PulseStages-X.Y.Z-debug.apk and
# SHA256SUMS.txt. A pre-release tag gives a GitHub pre-release. versionName / versionCode come from the tag
# (.github/scripts/version-from-tag.sh documents the rule); the notes are the tag's CHANGELOG.md section.
#
# Run workflow (Actions tab), dry_run checked (the default): builds and verifies both APKs from the selected branch or
# tag as versionName 0.0.0-dry.<run number>, versionCode 1, and uploads the debug APK as an artifact kept for 3 days.
# The release-signed APK is discarded, and nothing is published, so this checks the signing secrets before the first
# tag. With dry_run unchecked on a v* tag, it publishes that tag's release like a tag push.
#
# Repository secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD (release key, required) and
# DEBUG_KEYSTORE_BASE64 (optional fixed debug key). See docs/development.md, "Releases".

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and verify both APKs, upload the debug APK as a 3-day artifact; publish nothing"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dry-run:
    name: Dry run
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    permissions:
      contents: read
    uses: ./.github/workflows/build-apks.yml
    with:
      publish: false
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}

  release:
    name: Release
    if: github.event_name == 'push' || inputs.dry_run == false
    # The only job that can write: creating the release and uploading its assets needs contents: write.
    permissions:
      contents: write
    uses: ./.github/workflows/build-apks.yml
    with:
      publish: true
    secrets:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
