name: Release

# Builds, signs and publishes the release APK for tags of the form vMAJOR.MINOR.PATCH (e.g. v1.4.2).
#   versionName = tag without the leading "v"                     (1.4.2)
#   versionCode = MAJOR * 10000 + MINOR * 100 + PATCH            (10402)
# MINOR and PATCH must therefore stay below 100. The scheme is deterministic: re-running the workflow for the same
# tag always produces the same versionCode, and every higher semver gets a higher versionCode.
#
# Required repository secrets:
#   KEYSTORE_BASE64     base64 of the release keystore (base64 -w0 release.jks)
#   KEYSTORE_PASSWORD   keystore password
#   KEY_ALIAS           key alias inside the keystore
#   KEY_PASSWORD        key password

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Install missing Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          PACKAGES=()
          [ -d "$ANDROID_HOME/platforms/android-37.0" ] || PACKAGES+=("platforms;android-37.0")
          [ -d "$ANDROID_HOME/build-tools/36.0.0" ] || PACKAGES+=("build-tools;36.0.0")
          if [ "${#PACKAGES[@]}" -gt 0 ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "${PACKAGES[@]}"
          fi

      - name: Derive version from tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not of the form vMAJOR.MINOR.PATCH"
            exit 1
          fi
          MAJOR=$((10#${BASH_REMATCH[1]}))
          MINOR=$((10#${BASH_REMATCH[2]}))
          PATCH=$((10#${BASH_REMATCH[3]}))
          if (( MINOR > 99 || PATCH > 99 )); then
            echo "::error::MINOR and PATCH must be <= 99 for the versionCode scheme"
            exit 1
          fi
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          if (( CODE < 1 )); then
            echo "::error::versionCode must be positive"
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Release $VERSION (versionCode $CODE)"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set"
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/pulsestages-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "PULSESTAGES_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          PULSESTAGES_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PULSESTAGES_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PULSESTAGES_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        # No configuration cache here: it would persist the signing values read at configuration time.
        run: >-
          ./gradlew --no-configuration-cache assembleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ steps.version.outputs.code }}

      - name: Verify APK signature
        id: apk
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Signed APK not found (was signing configured?)"
            ls -l app/build/outputs/apk/release/ || true
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          OUT="$RUNNER_TEMP/PulseStages-${{ steps.version.outputs.name }}.apk"
          cp "$APK" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}"
          --verify-tag
          --title "PulseStages ${{ steps.version.outputs.name }}"
          --generate-notes

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pulsestages-release.jks"
