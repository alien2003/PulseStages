<?xml version="1.0" encoding="UTF-8"?>
<!-- "Get it on Obtainium" button of the README and the user guide, drawn for this project (not Obtainium's artwork).
     textLength keeps the layout the same with whichever sans-serif font the viewer has. -->
<svg xmlns="http://www.w3.org/2000/svg" width="161" height="48" viewBox="0 0 161 48" role="img" aria-labelledby="title">
  <title id="title">Get it on Obtainium</title>
  <rect x="0.5" y="0.5" width="160" height="47" rx="8" ry="8" fill="#000000" stroke="#A6A6A6"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24,11 V27"/>
    <path d="M18,21.5 L24,27.5 L30,21.5"/>
    <path d="M14,29 V33 A2,2 0 0 0 16,35 H32 A2,2 0 0 0 34,33 V29"/>
  </g>
  <g fill="#FFFFFF" font-family="Roboto, 'Segoe UI', 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif">
    <text x="46" y="19" font-size="9" letter-spacing="0.6"
          textLength="54" lengthAdjust="spacingAndGlyphs">GET IT ON</text>
    <text x="45" y="37" font-size="19" font-weight="600"
          textLength="101" lengthAdjust="spacingAndGlyphs">Obtainium</text>
  </g>
</svg>
